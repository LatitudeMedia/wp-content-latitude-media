name: ltm-core tests

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/ltm-core/**'
      - 'wp-content/themes/latitudemedia/**'
      - '.github/workflows/ltm-core-tests.yml'
  pull_request:
    paths:
      - 'wp-content/plugins/ltm-core/**'
      - 'wp-content/themes/latitudemedia/**'
      - '.github/workflows/ltm-core-tests.yml'

permissions:
  contents: read

concurrency:
  group: ltm-core-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: wp-content/plugins/ltm-core

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Keep this version in sync with .tool-versions (asdf-managed nodejs).
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: wp-content/plugins/ltm-core/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Install JS dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      # ACF Pro isn't committed to git; the composer install above pulls it
      # into ../advanced-custom-fields-pro using the COMPOSER_AUTH secret,
      # and .wp-env.json's wp-content/plugins mapping mounts it. This
      # CI-only override (already gitignored, never affects local dev)
      # points afterStart at a CI variant of the lifecycle script — see
      # bin/wp-env-after-start-ci.sh for how it differs from the local one.
      - name: Write CI wp-env override
        run: |
          cat > .wp-env.override.json <<'EOF'
          {
          	"plugins": [ "." ],
          	"lifecycleScripts": {
          		"afterStart": "./bin/wp-env-after-start-ci.sh"
          	}
          }
          EOF

      - name: Start wp-env
        run: npm run env:start
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Run PHPUnit
        run: npm run test:php

      # The WP core test suite's bootstrap (tests/bootstrap.php) reinstalls
      # WordPress on the tests-mysql database as part of its own fixture
      # setup, which deactivates ltm-core/latitudemedia on the same "tests"
      # environment Playwright targets below. Re-run the CI afterStart
      # script to reactivate them before Playwright starts. bin/wp-env-after-start-ci.sh
      # calls bare `wp-env`, which normally resolves because wp-env itself
      # injects npm's PATH when running lifecycle scripts — do that manually
      # here since this step invokes it directly, not as a lifecycle script.
      - name: Re-activate plugin/theme on tests instance
        run: PATH="$PWD/node_modules/.bin:$PATH" ./bin/wp-env-after-start-ci.sh
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Run Playwright
        run: npm run test:e2e

      - name: Show plugin/theme status on failure
        if: failure()
        run: |
          npx wp-env run tests-cli wp plugin list --fields=name,status || true
          npx wp-env run tests-cli wp theme list --fields=name,status || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: wp-content/plugins/ltm-core/artifacts
          retention-days: 7
          if-no-files-found: ignore
